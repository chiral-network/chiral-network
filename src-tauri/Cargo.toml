[package]
name = "chiral-network"
version = "2.0.0"
description = "Chiral Network"
authors = ["you"]
edition = "2021"
default-run = "chiral-desktop"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build"]

[lib]
name = "chiral_network"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "chiral-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "relay_server"
path = "src/bin/relay_server.rs"

[[bin]]
name = "chiral"
path = "src/bin/chiral.rs"

[[bin]]
name = "chiral_daemon"
path = "src/bin/chiral_daemon.rs"

[[bin]]
name = "chiral-policy-sign"
path = "src/bin/chiral_policy_sign.rs"

[[bin]]
name = "chiral_rpc_gateway"
path = "src/bin/chiral_rpc_gateway.rs"

[build-dependencies]
ed25519-dalek = "2.0"
hex = "0.4"
tauri-build = { version = "2", optional = true, features = [] }

[dependencies]
tauri = { version = "2", optional = true, features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
libp2p = { version = "0.53", features = ["kad", "tcp", "noise", "yamux", "ping", "identify", "macros", "tokio", "request-response", "relay"] }
futures = "0.3"
dirs = "5.0"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
secp256k1 = { version = "0.29", features = ["recovery"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
rlp = "0.5"
once_cell = "1.19"
parking_lot = "0.12"
clap = { version = "4.5", features = ["derive", "env"] }

ed25519-dalek = { version = "2.0", features = ["rand_core", "serde"] }
rand = { version = "0.8", features = ["std_rng"] }
base64 = "0.21"
async-trait = "0.1"

# Public inference, settlement, and local administration.
axum = { version = "0.7", features = ["macros"] }
uuid = { version = "1", features = ["v4"] }
tower = "0.5"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
zeroize = "1"
subtle = "2"
primitive-types = "0.12"
fs2 = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
