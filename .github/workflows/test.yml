name: LLM inference checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      real_gpu_qualification:
        description: Run paid qualification on an isolated, pre-provisioned Linux GPU runner
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install headless dependencies only
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev clang cmake protobuf-compiler
      - name: Compile and exercise headless libraries, binaries and integration tests
        run: cargo test --locked --no-default-features --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Require deployment scripts to parse
        run: python3 -m py_compile scripts/provision-provider.py scripts/provision-model.py scripts/provision-runtime.py scripts/provider-admin.py scripts/provider-preflight.py scripts/qualify-provider.py tests/scaled/paid-inference.py
      - name: Release headless build with actual policy verification key
        if: github.event_name != 'pull_request'
        env:
          CHIRAL_POLICY_PUBLIC_KEY: ${{ vars.CHIRAL_POLICY_PUBLIC_KEY }}
        run: |
          test -n "$CHIRAL_POLICY_PUBLIC_KEY" || { echo 'Configure the actual release policy public key'; exit 1; }
          cargo build --locked --release --no-default-features --manifest-path src-tauri/Cargo.toml --bins
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exercise offline native artifact and qualification boundaries
        run: python -m unittest discover -s scripts -p "test_*.py"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev clang cmake protobuf-compiler libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - name: Build native application with embedded frontend
        run: npm run tauri:build -- --debug --no-bundle
      - name: Exercise native platform and protected-storage tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
  real-gpu-qualification:
    if: github.event_name == 'workflow_dispatch' && inputs.real_gpu_qualification
    needs: [headless, frontend]
    environment: llm-qualification
    runs-on: [self-hosted, Linux, X64, chiral-isolated-gpu]
    timeout-minutes: 60
    concurrency:
      group: chiral-isolated-gpu-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Require explicit qualified deployment inputs
        env:
          CONSUMER_CONFIG: ${{ vars.CHIRAL_QUALIFICATION_CONSUMER_CONFIG }}
          OFFER_FILE: ${{ vars.CHIRAL_QUALIFICATION_OFFER_FILE }}
          COMPOSE_ENV: ${{ vars.CHIRAL_QUALIFICATION_COMPOSE_ENV }}
          FUNDING_WEI: ${{ vars.CHIRAL_QUALIFICATION_FUNDING_WEI }}
          CLI: ${{ vars.CHIRAL_QUALIFICATION_CLI }}
        run: |
          test -n "$FUNDING_WEI" && test -x "$CLI"
          test -f "$CONSUMER_CONFIG" && test -f "$OFFER_FILE" && test -f "$COMPOSE_ENV"
          python3 -m venv .qualification-venv
          .qualification-venv/bin/pip install -r tests/scaled/requirements.txt
          .qualification-venv/bin/python tests/scaled/paid-inference.py \
            --cli "$CLI" --config "$CONSUMER_CONFIG" --offer "$OFFER_FILE" \
            --funding-wei "$FUNDING_WEI" --restart-env "$COMPOSE_ENV" \
            --compose "$GITHUB_WORKSPACE/docker-compose.yml" --allow-isolated-restart \
            --report "qualification-${GITHUB_RUN_ID}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: real-paid-inference-evidence
          path: qualification-*.json
          if-no-files-found: error
