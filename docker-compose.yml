name: chiral-inference
# Native Linux only. HTTP engines/operator listeners remain loopback; only Caddy
# and explicitly configured libp2p listeners accept public traffic.
x-rust: &rust
  user: "10001:10001"
  network_mode: host
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  init: true
  pids_limit: 256
  tmpfs: [/tmp:size=64m,mode=1777]
  stop_grace_period: 90s
services:
  provider:
    <<: *rust
    image: chiral-provider:${RELEASE_ID:?Run scripts/provision-provider.py}
    build:
      context: .
      target: provider
      args: &build_args
        RUST_IMAGE: ${RUST_IMAGE:?Immutable Rust image required}
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:?Immutable Debian image required}
        CHIRAL_POLICY_PUBLIC_KEY: ${CHIRAL_POLICY_PUBLIC_KEY:?Release policy key required}
    volumes:
      - ${DEPLOY_DIR:?}/provider.json:/etc/chiral/provider.json:ro
      - ${DEPLOY_DIR}/version-policy.json:/etc/chiral/version-policy.json:ro
      - ${DEPLOY_DIR}/qualification:/etc/chiral/qualification:ro
      - ${DEPLOY_DIR}/secrets/provider.key:/run/secrets/provider.key:ro
      - ${DEPLOY_DIR}/secrets/admin.token:/run/secrets/admin.token:ro
      - ${DEPLOY_DIR}/secrets/engine.token:/run/secrets/engine.token:ro
      - ${DEPLOY_DIR}/secrets/rpc.token:/run/secrets/rpc.token:ro
      - ${DEPLOY_DIR}/data/provider:/var/lib/chiral
      - ${MODEL_DIR:?Immutable GGUF artifact required}:/model:ro
      - ${LLAMA_RUNTIME_DIR:?Pinned llama.cpp runtime required}:/runtime:ro
    extends:
      file: ${DEPLOY_DIR}/provider-devices.json
      service: provider
    pids_limit: 1024
    shm_size: 2gb
    tmpfs: [/tmp:size=2g,mode=1777]
    depends_on:
      chain-rpc: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:9419/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
  relay:
    <<: *rust
    image: chiral-relay:${RELEASE_ID}
    build: {context: ., target: relay, args: *build_args}
    volumes:
      - ${DEPLOY_DIR}/relay.json:/etc/chiral/relay.json:ro
      - ${DEPLOY_DIR}/version-policy.json:/etc/chiral/version-policy.json:ro
      - ${DEPLOY_DIR}/secrets/rpc.token:/run/secrets/rpc.token:ro
      - ${DEPLOY_DIR}/data/relay:/var/lib/chiral
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8081/api/health]
      interval: 15s
      timeout: 5s
      retries: 3
  chain-rpc:
    <<: *rust
    image: chiral-rpc:${RELEASE_ID}
    build: {context: ., target: chain-rpc, args: *build_args}
    command: [--config, /etc/chiral/rpc-gateway.json, --bind, "127.0.0.1:8547", --journal-dir, /var/lib/chiral, --bearer-file, /run/secrets/rpc.token]
    volumes:
      - ${DEPLOY_DIR}/rpc-gateway.json:/etc/chiral/rpc-gateway.json:ro
      - ${DEPLOY_DIR}/secrets/rpc.token:/run/secrets/rpc.token:ro
      - ${DEPLOY_DIR}/secrets/upstream-rpc.token:/run/secrets/upstream-rpc.token:ro
      - ${DEPLOY_DIR}/data/rpc:/var/lib/chiral
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1:8547/healthz]
      interval: 15s
      timeout: 5s
      retries: 3
  ingress:
    profiles: [public]
    image: ${CADDY_IMAGE:?Pinned Caddy digest required}
    user: "10001:10001"
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 128
    volumes:
      - ${DEPLOY_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DEPLOY_DIR}/data/tls:/data
      - ${DEPLOY_DIR}/data/caddy:/config
    depends_on: [provider, relay, chain-rpc]
